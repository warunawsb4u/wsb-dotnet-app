name: Build, Test, and Deploy .NET App to Azure

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'
  AZURE_WEBAPP_NAME: 'rg-dotnet-apps' # Replace with your Azure Web App name

jobs:
  # -------------------------------------------------------------
  # JOB 1: Build and Test
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Dependencies
        run: dotnet restore MyHelloWorldApp.sln

      - name: Build Solution
        run: dotnet build MyHelloWorldApp.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test tests/MyHelloWorldApp.Tests/MyHelloWorldApp.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Publish Web App
        run: dotnet publish src/MyHelloWorldApp/MyHelloWorldApp.csproj --configuration Release --no-build --output ./publish

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app-bundle
          path: ./publish

  # -------------------------------------------------------------
  # JOB 2: Deploy to Azure App Service
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app-bundle
          path: ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
