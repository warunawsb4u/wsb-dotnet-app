name: Build, Test, and Deploy .NET App to Azure

on:
  # Triggers when code is pushed to the main branch
  push:
    branches: [ "main" ]

  # Allows manual triggering from the GitHub Actions tab
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'                # .NET SDK version
  AZURE_WEBAPP_NAME: 'my-dotnet-webapp' # Replace with your Azure Web App service name

jobs:
  # -------------------------------------------------------------
  # JOB 1: Build and Test
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Set up .NET Core / .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Step 3: Restore dependencies from NuGet
      - name: Restore Dependencies
        run: dotnet restore dotnet/MyHelloWorldApp.sln

      # Step 4: Build the entire solution (Release mode)
      - name: Build Solution
        run: dotnet build dotnet/MyHelloWorldApp.sln --configuration Release --no-restore

      # Step 5: Run Automated Unit Tests
      - name: Run Tests
        run: dotnet test dotnet/tests/MyHelloWorldApp.Tests/MyHelloWorldApp.Tests.csproj --configuration Release --no-build --verbosity normal

      # Step 6: Publish the Web App to an output folder
      - name: Publish Web App
        run: dotnet publish dotnet/src/MyHelloWorldApp/MyHelloWorldApp.csproj --configuration Release --no-build --output ./publish

      # Step 7: Upload compiled app artifact for the deploy job
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app-bundle
          path: ./publish

  # -------------------------------------------------------------
  # JOB 2: Deploy to Azure App Service
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-test # Only runs if build-and-test passes!

    steps:
      # Step 1: Download the artifact produced in the build step
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app-bundle
          path: ./publish

      # Step 2: Deploy to Azure Web App using Publish Profile
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./publish
          # Stored in GitHub Repo: Settings -> Secrets and variables -> Actions
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
